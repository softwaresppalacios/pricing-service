server:
  port: 8083
spring:
  application:
    name: pricing-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pricing_service_db?currentSchema=pricing_service}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: pricing_service
  sql:
    init:
      mode: always
